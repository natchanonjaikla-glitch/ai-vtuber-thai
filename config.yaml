# ============================================================
#  AI VTuber — ไฟล์ตั้งค่าหลัก
#  ค่าใน .env จะ override ค่าในไฟล์นี้ (ดู src/config.py)
# ============================================================

llm:
  # LM Studio local server (OpenAI-compatible)
  base_url: "http://localhost:1234/v1"
  api_key: "lm-studio"            # LM Studio ไม่ตรวจ key แต่ SDK ต้องมีค่า
  # ชื่อโมเดลตามที่โหลดไว้ใน LM Studio (ดูจากแท็บ Developer / My Models)
  model: "google/gemma-4-e4b"
  temperature: 0.7
  max_tokens: 1024
  timeout_sec: 120
  # จำนวนคู่สนทนาที่เก็บเป็น context (นับเป็น "รอบ" user+assistant)
  history_turns: 8

persona:
  name: "ไอริส"
  language: "th"
  # บุคลิก/สไตล์ — จะถูกใส่ใน system prompt
  style: >
    เป็น VTuber สาวสดใส เป็นกันเอง พูดภาษาไทยธรรมชาติเหมือนคุยกับเพื่อน
    ตอบสั้นกระชับ 1–3 ประโยค เพราะคำตอบจะถูกอ่านออกเสียง
    ไม่ใช้ bullet point ไม่ใช้ markdown ไม่ใส่อิโมจิเยอะ
    ลงท้ายด้วย "ค่ะ/นะคะ" อย่างเป็นธรรมชาติ
  # ให้โมเดลปล่อยมาร์กเกอร์นี้เองเมื่อเจองานเขียนโค้ดที่ยากเกินกำลัง
  delegate_marker: "[[DELEGATE_TO_CLAUDE: <อธิบายงานให้ละเอียด> ]]"

tts:
  # เลือกเสียง — สลับตอนรันได้ด้วย /voice <ชื่อ>
  #   piper = ไทย ธรรมชาติพอควร เร็วมาก offline  ← แนะนำ
  #   edge  = ธรรมชาติที่สุด (neural ของ Microsoft) เร็วมาก แต่ "ต้องต่อเน็ต"
  #   mms   = เร็ว offline แต่เสียงหุ่นยนต์
  #   f5    = โคลนเสียงจากตัวอย่างได้ offline แต่ช้ามาก ~6 นาที/ประโยค (อัดล่วงหน้าเท่านั้น)
  engine: "piper"
  cpu_threads: 8                  # Ryzen 5 5600 = 12 threads, เผื่อ 8 ให้ TTS
  cache_dir: ".cache/tts"
  max_chars_per_chunk: 180        # ตัดประโยคยาวไม่ให้เกินนี้ต่อ 1 ครั้งสังเคราะห์

  piper:
    voice: "th_TH-tsync2-medium"   # เสียงไทยของ Piper (โมเดล ~60 MB โหลดอัตโนมัติ)
    speed: 1.0                     # >1 = พูดเร็วขึ้น
    noise_scale: 0.667             # ความแปรผันของน้ำเสียง (สูง = มีอารมณ์ขึ้น)
    noise_w: 0.8                   # ความแปรผันของจังหวะ

  edge:
    voice: "th-TH-PremwadeeNeural" # หญิง | ชาย = "th-TH-NiwatNeural"
    rate: "+0%"                    # เช่น "+10%" ให้พูดเร็วขึ้น
    pitch: "+0Hz"                  # เช่น "+20Hz" ให้เสียงสูงขึ้น
    volume: "+0%"

  mms:
    model_id: "facebook/mms-tts-tha"

  f5:
    hf_repo: "VIZINTZOR/F5-TTS-THAI"
    model_name: "v1"                       # โมเดล 1,000,000 steps
    ref_wav: "assets/voice_ref/ref.wav"    # ไม่มีก็ได้ — จะดึงเสียงตัวอย่างจาก repo มาใช้
    ref_text: "assets/voice_ref/ref.txt"   # ข้อความที่พูดใน ref.wav (ไฟล์ .txt หรือข้อความตรง ๆ)
    nfe_step: 16                           # ลดเพื่อเร็วขึ้น (ก็ยังช้าบน CPU)
    speed: 1.0

avatar:
  enabled: true
  vts_url: "ws://localhost:8001"
  plugin_name: "AI VTuber Brain"
  plugin_developer: "Natchanon"
  token_file: ".vts_token"
  mouth_param: "MouthOpen"       # พารามิเตอร์อินพุตมาตรฐานของ VTS
  fps: 30                        # อัตราการส่งค่าปาก (30 พอ, ปลอดภัยกับ rate limit ของ VTS)
  gain: 1.6                      # ขยายความแรงการอ้าปาก
  noise_gate: 0.14              # ต่ำกว่านี้ = เงียบ ปากปิดสนิท (เพิ่มค่า = หุบปากบ่อยขึ้น)
  smoothing_attack: 0.6          # 0–1 ยิ่งมากยิ่งตอบไว (ตอนเสียงดังขึ้น)
  smoothing_release: 0.25        # 0–1 ยิ่งน้อยยิ่งค้างนาน (ตอนเสียงเบาลง)

coding:
  # โฟลเดอร์เริ่มต้นที่ Claude Code จะเข้าไปทำงาน (เปลี่ยนได้ด้วย /project <path>)
  default_project: "./workspace"
  timeout_sec: 900
  # acceptEdits = แก้ไฟล์ให้อัตโนมัติ | bypassPermissions = ทำได้ทุกอย่างไม่ถาม (เสี่ยงกว่า)
  permission_mode: "acceptEdits"
  # ผู้ใช้พิมพ์คำเหล่านี้ = สั่งส่งงานให้ Claude Code ทันที (ทางลัด ไม่ต้องพึ่งโมเดล)
  trigger_phrases:
    - "เรียก claude"
    - "เรียก claude code"
    - "ให้ claude"
    - "สั่ง claude"
    - "งานยาก"
    - "ช่วยเขียนโค้ด"
    - "/claude"
